# nginx site for the KR-bot Web Monitor. Installed by scripts/web-setup.sh as
# /etc/nginx/sites-available/krbot (linked into sites-enabled, replacing the stock "default" site).
# krbot_web.py listens on 127.0.0.1 only; nginx is the LAN-facing side and ufw limits it to local subnets.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Server-Sent Events: keep the stream open and unbuffered
    location = /events {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

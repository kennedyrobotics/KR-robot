# krbot runtime configuration. Any key can be overridden on the command line as --section.key=value.

log = info
status_period_ms = 2000

[motor]
driver = yahboom            # yahboom | sim   (--dry-run forces sim)
port = /dev/ttyAMA0         # header UART pins 8/10 -> Yahboom UART2 (wiring-manual §5.1b)
fallback_port = /dev/krc-motor  # USB-C link (udev symlink), used only if the primary does not exist
mode = pwm                  # pwm (open loop, current 33GB-520s) | speed (after encoder upgrade)
profile = 33gb520           # 33gb520 | md520
init_on_open = true
pwm_keyword = pwm           # confirmed: Yahboom "1.2 Control command" doc
speed_keyword = spd         # confirmed: same doc
max_output = 1800           # clamp, PWM counts; full scale is ±3600 (confirmed), so 1800 = 50 %
battery_poll_ms = 1000      # $read_vol# interval; the reply is also the board-alive heartbeat (0 = off)

[input]
device =                    # empty = first gamepad found

[teleop]
rate_hz = 50
max_output = 1800
stick_deadband = 0.08
expo = 0.3
turn_scale = 0.6
slew_per_s = 3.0
deadman_release_ms = 40       # LB must read released this long to stop (debounces BT button drop-outs, notes §8)
tank = false
invert_left = false
invert_right = true
left_channel = 1
right_channel = 2

[battery]                   # 2S LiPo via the motor board's $read_vol# (0.1 V steps; reads low under load)
cells = 2
warn_v = 7.0                # 3.5 V/cell: amber, log warning
low_v = 6.6                 # 3.3 V/cell: red, log warning
block_arm_below_v = 6.6     # refuse ARM on a fresh reading below this (0 = never block). Never stops a robot already driving
stale_s = 5                 # older readings count as unknown and never block
min_valid_v = 4.0           # lower readings are ignored (board reports 0.0 V briefly at power-up)

[watchdog]
timeout_ms = 200            # control loop must tick within this or motors are stopped directly

[percep]
period_ms = 100

[reason]
period_ms = 50
run_limit = 300             # bounded CLIPS run per tick (doc v3 §5.3)

[arbiter]
period_ms = 50
hysteresis = 10

[monitor]
enabled = true              # KR-bot Monitor server (line-delimited JSON over TCP)
bind = 127.0.0.1            # 0.0.0.0 to allow LAN clients (also: sudo ufw allow 5765/tcp)
port = 5765
rate_hz = 10
